name: Install XP Ledger source
on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import lzma
          import tarfile

          parts = sorted(Path('.github/bootstrap').glob('part-*.txt'))
          if len(parts) != 13:
              raise RuntimeError(f'Expected 13 source parts, found {len(parts)}')

          packed = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          archive = lzma.decompress(packed)
          expected = 'b840dd552beb9d735746d66918458e7c32ece32f8b64b2fe05dea56d427ce524'
          if hashlib.sha256(archive).hexdigest() != expected:
              raise RuntimeError('Source archive checksum mismatch')

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:') as bundle:
              for member in bundle:
                  path = Path(member.name)
                  if not member.isfile() or path.is_absolute() or '..' in path.parts:
                      raise RuntimeError(f'Unexpected archive entry: {member.name}')
              bundle.extractall(filter='data')
          print('Verified and restored', len(parts), 'source parts')
          PY
      - name: Run XP calculator tests
        run: npm test
      - name: Commit site and clean up temporary installation files
        run: |
          rm -rf .github/bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete XP Ledger calculator"
          git push
